<kles-dialog-layout
  [icon]="icon"
  [fullsize]="fullsize()"
  [fullsizeButton]="fullsizeButton()"
  (fullsizeToggle)="toggleFullsize()"
>
  <span klesDialogTitle>{{ title }}</span>

  <p klesDialogContent class="message kles-message-dialog__message">
    {{ message }}
  </p>

  <div klesDialogActionsEnd>
    <button class="kles-message-dialog__button" mat-button mat-dialog-close>{{ cancelButtonText }}</button>
    <button class="kles-message-dialog__button" mat-flat-button color="primary" (click)="onConfirmClick()">
      {{ confirmButtonText }}
    </button>
  </div>
</kles-dialog-layout>
