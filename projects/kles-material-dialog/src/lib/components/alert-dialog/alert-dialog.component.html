<kles-dialog-layout
  [icon]="icon"
  [fullsize]="fullsize()"
  [fullsizeButton]="fullsizeButton()"
  (fullsizeToggle)="toggleFullsize()"
>
  <span klesDialogTitle>{{ title }}</span>

  <p klesDialogContent class="kles-message-dialog__message">{{ message }}</p>

  <button
    klesDialogActionsEnd
    class="kles-message-dialog__button"
    mat-flat-button
    color="primary"
    mat-dialog-close
  >
    {{ cancelButtonText }}
  </button>
</kles-dialog-layout>
