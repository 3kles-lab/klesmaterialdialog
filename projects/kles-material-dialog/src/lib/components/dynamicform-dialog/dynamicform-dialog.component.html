<div class="title kles-message-dialog__header">
  @if (title) {
    <div mat-dialog-title class="kles-message-dialog__title">
      @if (icon) {
        <span class="kles-message-dialog__icon-wrap" aria-hidden="true">
          <mat-icon class="icon-title" [fontIcon]="icon"></mat-icon>
        </span>
      }

      <span class="kles-message-dialog__title-text">{{ title }}</span>

      @if (fullsizeButton()) {
        <button
          class="fullsize-button kles-message-dialog__fullsize"
          mat-icon-button
          type="button"
          [attr.aria-label]="
            fullsize() ? 'Exit full screen' : 'Enter full screen'
          "
          (click)="toggleFullsize()"
        >
          @if (fullsize()) {
            <mat-icon>fullscreen_exit</mat-icon>
          } @else {
            <mat-icon>fullscreen</mat-icon>
          }
        </button>
      }
    </div>
  }
</div>

<mat-dialog-content class="kles-message-dialog__content">
  <app-kles-dynamic-form
    [direction]="direction"
    [fields]="fields"
    [validators]="validators"
    [asyncValidators]="asyncValidators"
  >
  </app-kles-dynamic-form>

  @if (error$ | async; as error) {
    <div #errorElem>
      <mat-error>{{ error?.message }}</mat-error>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions class="kles-message-dialog__actions" align="end">
  <button mat-button color="primary" (click)="onClose()">
    {{ buttonCancel }}
  </button>
  <button
    mat-flat-button
    color="primary"
    [disabled]="!dynamicForm.form.valid || (pending | async)"
    (click)="onOK()"
  >
    {{ buttonOK }}

    @if (pending | async) {
      <mat-icon
        ><mat-spinner color="primary" diameter="18"></mat-spinner
      ></mat-icon>
    }
  </button>
</mat-dialog-actions>
