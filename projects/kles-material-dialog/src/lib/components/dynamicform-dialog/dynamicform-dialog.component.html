<kles-dialog-layout
  [icon]="icon"
  [fullsize]="fullsize()"
  [fullsizeButton]="fullsizeButton()"
  (fullsizeToggle)="toggleFullsize()"
>
  <span klesDialogTitle>{{ title }}</span>

  <app-kles-dynamic-form
    klesDialogContent
    [direction]="direction"
    [fields]="fields"
    [validators]="validators"
    [asyncValidators]="asyncValidators"
  >
  </app-kles-dynamic-form>

  @if (error$ | async; as error) {
    <div klesDialogStatus #errorElem>
      <mat-error>{{ getErrorMessage(error) }}</mat-error>
    </div>
  }

  <div klesDialogActionsEnd>
    <button mat-button color="primary" (click)="onClose()">
      {{ buttonCancel }}
    </button>
    <button
      mat-flat-button
      color="primary"
      [disabled]="!dynamicForm.form.valid || (pending | async)"
      (click)="onOK()"
    >
      {{ buttonOK }}

      @if (pending | async) {
        <mat-icon
          ><mat-spinner color="primary" diameter="18"></mat-spinner
        ></mat-icon>
      }
    </button>
  </div>
</kles-dialog-layout>
